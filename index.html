
<!DOCTYPE html>
<html lang="es" data-theme="light" data-text-size="md" data-animations="on">
<head>
  <meta charset="UTF-8">
  <base>
  <script>
    if (location.protocol !== 'file:') {
      const mirror = location.hostname === 'normalguy749.github.io';
      const local = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      document.querySelector('base').href = mirror || (local && /^\/SMR_Hub(?:\/|$)/.test(location.pathname))
        ? '/SMR_Hub/' : '/';
    }
    // Espera a fijar la base antes de permitir la precarga del módulo.
    document.write('<script src="js/routing.js"><\/script>');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SMR Hub">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/brand/icon-192.png">
  <meta name="description" id="meta-desc" content="Recursos, tests y herramientas para estudiar Sistemas Microinformáticos y Redes.">

  <link rel="canonical" href="https://smr-hub.pages.dev/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SMR Hub">
  <meta property="og:locale" content="es_ES">
  <meta property="og:url" content="https://smr-hub.pages.dev/">

  <meta property="og:description" content="Recursos, tests y herramientas para estudiar Sistemas Microinformáticos y Redes.">
  <meta property="og:image" content="https://smr-hub.pages.dev/assets/brand/SMR.png">
  <meta property="og:image:alt" content="Logotipo de SMR Hub">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="SMR Hub — Tests y recursos de Sistemas Microinformáticos y Redes">
  <meta name="twitter:description" content="Recursos, tests y herramientas para estudiar Sistemas Microinformáticos y Redes.">
  <meta name="twitter:image" content="https://smr-hub.pages.dev/assets/brand/SMR.png">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "SMR Hub",
    "url": "https://smr-hub.pages.dev/",
    "description": "Recursos, tests y herramientas para estudiar Sistemas Microinformáticos y Redes.",
    "inLanguage": "es"
  }
  </script>
  <link rel="icon" type="image/png" href="assets/brand/SMR.png">

  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('smrhub:settings') || '{}');
        var dark = s.theme
          ? s.theme === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        var root = document.documentElement;

        root.dataset.theme = dark ? 'dark' : 'light';
        if (s.textSize) root.dataset.textSize = s.textSize;
        if (s.animations === false) root.dataset.animations = 'off';
      } catch (e) {
        /* Las preferencias son opcionales. */
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/phase7.css">
  <link rel="stylesheet" href="css/print.css">
</head>

<body>
  <a class="skip-link" href="#content">Saltar al contenido</a>

  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Barra lateral">
      <div class="sidebar-brand">
        <a class="brand-link" href="./">
          <img
            class="brand-logo"
            src="assets/brand/SMR.png"
            alt=""
            width="28"
            height="28"
            onload="this.classList.add('is-loaded')"
            onerror="this.remove()"
          >
          <span class="brand-word">SMR Hub</span>
        </a>
      </div>

      <nav class="sidebar-nav" aria-label="Secciones">
        <ul id="nav-list"></ul>
      </nav>

      <div class="sidebar-footer">
        <ul id="nav-footer"></ul>
      </div>
    </aside>

    <div class="scrim" id="scrim" hidden></div>

    <div class="main">
      <header class="topbar">
        <button
          class="icon-btn menu-btn"
          id="menu-btn"
          type="button"
          aria-label="Abrir menú"
          aria-expanded="false"
          aria-controls="sidebar"
        ></button>

        <div class="topbar-title">
          <h1 id="page-title">Inicio</h1>
          <p id="page-desc"></p>
        </div>

        <div class="topbar-actions">
          <div class="search" id="search" role="search">
            <span class="search-icon" id="search-icon" aria-hidden="true"></span>
            <input
              type="search"
              class="input search-input"
              id="search-input"
              placeholder="Buscar"
              aria-label="Buscar"
              autocomplete="off"
              spellcheck="false"
            >
            <div class="search-results" id="search-results" hidden></div>
          </div>

          <button
            class="icon-btn palette-btn"
            id="palette-btn"
            type="button"
            title="Búsqueda global (Ctrl+K)"
            aria-label="Abrir búsqueda global (Ctrl+K)"
          ></button>

          <button class="icon-btn" id="theme-btn" type="button"></button>
        </div>
      </header>

      <main class="content" id="content" tabindex="-1"></main>
    </div>
  </div>

  <nav class="mobile-nav" id="mobile-nav" aria-label="Navegación principal"></nav>

  <script src="js/data.js" defer></script>
  <script src="js/curriculum.js" defer></script>
  <script src="js/content.js" defer></script>
  <script src="js/questions.js" defer></script>
  <script src="js/srs.js" defer></script>
  <script src="js/tools.js" defer></script>
  <script src="js/tests.js" defer></script>
  <script src="js/pdf-export.js" defer></script>
  <script src="js/dashboard.js" defer></script>
  <script src="js/profile.js" defer></script>
  <script src="js/offline-store.js" defer></script>
  <script src="js/app.js" defer></script>

  <!-- Carga la configuración pública antes de los scripts defer de Supabase. -->
  <script>
    (function () {
      var configSrc = window.location.hostname === 'normalguy749.github.io'
        ? 'https://smr-hub.pages.dev/js/cloud-config.public'
        : 'js/cloud-config.public';

      document.write('<script src="' + configSrc + '"><\/script>');
    })();
  </script>

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script defer src="js/cloud-config.js"></script>
  <script defer src="js/supabase.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/cloud-profile.js"></script>
  <script defer src="js/cloud-progress.js"></script>
  <script defer src="js/cloud-feedback.js"></script>
</body>
</html>
